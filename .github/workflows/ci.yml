name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OpsFlow.slnx

      - name: Build
        run: dotnet build OpsFlow.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test OpsFlow.slnx
          --configuration Release
          --no-build
          --settings coverage.runsettings
          --collect "XPlat Code Coverage"
          --results-directory TestResults
          --logger trx

      - name: Coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage \
            -reporttypes:"MarkdownSummaryGithub;Html"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/TestResults/**/*.trx
            backend/coverage/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare environment
        run: |
          sed \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" \
            -e "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=$(openssl rand -hex 24)|" \
            -e "s|^JWT_SIGNING_KEY=.*|JWT_SIGNING_KEY=$(openssl rand -base64 48 | tr -d '\n')|" \
            -e "s|^AUTH_RATE_LIMIT=.*|AUTH_RATE_LIMIT=1000|" \
            .env.example > .env

      - name: Start the stack
        run: docker compose --profile app up --detach --build

      - name: Wait for the web app
        run: |
          for i in $(seq 1 60); do
            curl --fail --silent http://localhost:8080/health > /dev/null \
              && curl --fail --silent --output /dev/null http://localhost:3000/login \
              && exit 0
            sleep 2
          done
          exit 1

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: frontend
        env:
          CI: true
          E2E_API_URL: http://localhost:8080
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Compose logs
        if: failure()
        run: docker compose --profile app logs --no-color > compose.log

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            compose.log
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose --profile app down --volumes
