name: opsflow

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
  ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
  Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
  Cors__AllowedOrigins__0: ${WEB_PUBLIC_URL:-http://localhost:3000}
  Frontend__BaseUrl: ${WEB_PUBLIC_URL:-http://localhost:3000}
  Email__Host: mailpit
  Email__Port: "1025"
  Email__Security: None
  Email__FromAddress: ${EMAIL_FROM_ADDRESS:-no-reply@opsflow.local}
  RateLimiting__AuthPermitLimit: ${AUTH_RATE_LIMIT:-10}

services:

  # PostgreSQL — birincil veritabanı

  postgres:
    image: postgres:18-alpine
    container_name: opsflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis — cache ve sayaçlar

  redis:
    image: redis:8-alpine
    container_name: opsflow-redis
    restart: unless-stopped

    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: opsflow-mailpit
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # Uygulama: docker compose --profile app up -d --build

  migrate:
    profiles: ["app"]
    build: ./backend
    image: opsflow-api
    command: ["--migrate"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build: ./backend
    image: opsflow-api
    container_name: opsflow-api
    restart: unless-stopped
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/App_Data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8080}
    image: opsflow-web
    container_name: opsflow-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  uploads:
